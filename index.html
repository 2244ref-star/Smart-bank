<style>

.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px}
.tab{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;font-weight:600;font-size:13px;color:var(--tl);cursor:pointer}
.tab.on{background:var(--p);color:#fff}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fg input,.fg select{width:100%;padding:11px 13px;border:2px solid var(--b);border-radius:10px;background:#f8fafc}

.tin{text-align:center;font-size:22px;letter-spacing:8px;font-weight:700;font-family:monospace}

.bp{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff}
.bs{background:#10b981;color:#fff}
.bd{background:var(--d);color:#fff}
.bw{background:var(--w);color:#fff}
.bi{background:#2563eb;color:#fff}
.bo{background:#fff;color:var(--p);border:2px solid var(--p)}
.bsm{padding:6px 10px;font-size:11px;width:auto;border-radius:8px}

#app.on{display:block}

.tc{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;width:calc(100% - 30px);max-width:380px;pointer-events:none}
.toast{background:#fff;padding:10px 12px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;border-left:4px solid #10b981;pointer-events:auto;animation:sld .25s}
.toast.e{border-left-color:var(--d)}
.toast.i{border-left-color:var(--g)}
@keyframes sld{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.qr{text-align:center;padding:14px;background:var(--bg);border-radius:12px;margin:10px 0;border:2px dashed var(--g)}
.qr img{width:170px;height:170px;background:#fff;padding:6px;border-radius:10px}
.sk{background:#052e16;color:#6ee7b7;padding:10px;border-radius:8px;font-family:monospace;font-size:11px;margin-top:8px;word-break:break-all;text-align:center;letter-spacing:1.5px;border-left:3px solid var(--g)}
.nt{background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.02));border:1.5px dashed var(--g);border-radius:12px;padding:10px;font-size:11px;color:var(--gd);text-align:center;line-height:1.6;margin-bottom:14px}
.pw{padding:8px 10px;border-radius:10px;margin-bottom:11px;font-size:11px;display:none}
.pw.ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;display:block}
.pw.wk{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;display:block}
@media(min-width:640px){.ov{align-items:center}.md{border-radius:20px}}
</style>
</head>

<script>

let FB=null,_fbT=null;
function fbCfgOk(){return FB_CFG.apiKey&&FB_CFG.apiKey.indexOf('PASTE')!==0&&FB_CFG.databaseURL&&FB_CFG.databaseURL.indexOf('PASTE')!==0}

/* Debounced cloud push after every write */
function fbSync(){if(!FB)return;clearTimeout(_fbT);_fbT=setTimeout(fbPush,600)}
function fbPush(){
  if(!FB)return;
  const ts=Date.now();
  const st={u:DB.g('u',[]),a:DB.g('a',[]),t:DB.g('t',[]),l:DB.g('l',[]),n:DB.ctr(),cfg:DB.cfg(),ts:ts};

/* Pull remote data only when newer (last-write-wins) */
async function fbPull(){
  if(!FB)return false;

    const snap=await FB.get();

    if(!v||!v.ts)return false;

    if(Array.isArray(v.l))DB.sl(v.l);
    if(v.n)DB.sct(v.n);
    if(v.cfg)DB.sc(v.cfg);
    try{localStorage.setItem('fb_ts',String(v.ts))}catch(e){}

  }catch(e){console.warn('FB pull:',e);return false}

/* ============ 1. CRYPTO (SHA1 + HMAC + TOTP) ============ */
function rotl(n,b){return((n<<b)|(n>>>(32-b)))>>>0}
function sha1(bytes){
  const K=[0x5a827999,0x6ed9eba1,0x8f1bbcdc,0xca62c1d6];
  const H=[0x67452301,0xefcdab89,0x98badcfe,0x10325476,0xc3d2e1f0];
  const ml=bytes.length*8, tl=Math.ceil((bytes.length+9)/64)*64;
  const msg=new Uint8Array(tl);msg.set(bytes);msg[bytes.length]=0x80;
  const v=new DataView(msg.buffer);
  v.setUint32(tl-8,Math.floor(ml/4294967296),false);v.setUint32(tl-4,ml>>>0,false);
  for(let i=0;i<tl;i+=64){
    const w=new Uint32Array(80);
    for(let j=0;j<16;j++)w[j]=v.getUint32(i+j*4,false);
    for(let j=16;j<80;j++)w[j]=rotl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);
    let[a,b,c,d,e]=H;
    for(let j=0;j<80;j++){
      let f,k;
      if(j<20){f=(b&c)|(~b&d);k=K[0]}
      else if(j<40){f=b^c^d;k=K[1]}
      else if(j<60){f=(b&c)|(b&d)|(c&d);k=K[2]}
      else{f=b^c^d;k=K[3]}
      const t=(rotl(a,5)+f+e+k+w[j])>>>0;
      e=d;d=c;c=rotl(b,30);b=a;a=t;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;
  }
  const o=new Uint8Array(20),ov=new DataView(o.buffer);
  for(let i=0;i<5;i++)ov.setUint32(i*4,H[i],false);
  return o;
}
function cat(a,b){const o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o}
function hmac(k,m){
  const bs=64;
  if(k.length>bs)k=sha1(k);
  const p=new Uint8Array(bs);p.set(k);
  const op=new Uint8Array(bs),ip=new Uint8Array(bs);
  for(let i=0;i<bs;i++){op[i]=p[i]^0x5c;ip[i]=p[i]^0x36}
  return sha1(cat(op,sha1(cat(ip,m))));
}
function b32d(s){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  s=s.replace(/[^A-Z2-7]/gi,'').toUpperCase();
  let bits=0,val=0;const o=[];
  for(const c of s){
    const i=A.indexOf(c);if(i===-1)continue;
    val=(val<<5)|i;bits+=5;
    if(bits>=8){o.push((val>>>(bits-8))&0xff);bits-=8}
  }
  return new Uint8Array(o);
}
function totp(secret,time){
  time=time||Date.now();
  const c=Math.floor(time/1000/30);
  const cb=new Uint8Array(8);
  const v=new DataView(cb.buffer);
  v.setUint32(0,Math.floor(c/4294967296),false);
  v.setUint32(4,c>>>0,false);
  const h=hmac(b32d(secret),cb);
  const off=h[19]&0x0f;
  const code=((h[off]&0x7f)<<24)|((h[off+1]&0xff)<<16)|((h[off+2]&0xff)<<8)|(h[off+3]&0xff);
  return String(code%1000000).padStart(6,'0');
}
function verifyTOTP(secret,code){
  for(let i=-1;i<=1;i++){if(totp(secret,Date.now()+i*30000)===code)return true}
  return false;
}
/* 32-char valid Base32 secret */
function newSecret(){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let s='';
  const a=new Uint8Array(32);crypto.getRandomValues(a);
  for(let i=0;i<32;i++)s+=A[a[i]%32];
  return s;
}
function hash(pwd){
  const salt='sib_2024_';
  const b=new TextEncoder().encode(salt+pwd+salt);
  return Array.from(sha1(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

  if((u.doc||'nid')==='nid'&&u.nid)return String(u.nid);

}

  let base=accBaseNo(u);

  const mine=DB.accs().filter(a=>a.uid===uid);
  if(!mine.some(a=>a.cur==='BDT'))addAcc({uid:uid,type:'savings',cur:'BDT',init:0,no:base});
  if(!mine.some(a=>a.cur==='USD'))addAcc({uid:uid,type:'current',cur:'USD',init:0,no:base});
}

  const t=DB.txs().find(x=>x.id===tid);
  if(!t)return toast('none','e');
  const a=findA(t.aid);
  openM(`<div class="hn"></div><h2>↩️ Reverse</h2><p class="sb">Balance will be restored</p>

function revC(tid){
  try{
    const t=DB.txs().find(x=>x.id===tid);
    if(t.status==='reversed')throw new Error('Already reversed');
    if(t.type==='transfer')throw new Error('Transfers cannot be reversed');
    const a=findA(t.aid);
    if(!a)throw new Error('No accounts');
    const inc=['deposit','cash_in'];
    let nb;
    if(inc.includes(t.type)){if(a.bal<t.amt)throw new Error('Insufficient balance');nb=a.bal-t.amt}
    else nb=a.bal+t.amt;
    updAcc(a.id,{bal:nb});
    updTx(tid,{status:'reversed',rev_by:SS.id});
    addTx({aid:a.id,type:inc.includes(t.type)?'withdraw':'deposit',amt:t.amt,cur:t.cur,bal_after:nb,by:SS.id});
    log(SS.id,'TX_REVERSED',{t:tid});
    toast('↩️ Reversed');closeM();txsView(document.getElementById('ct'));
  }catch(e){toast(e.message,'e')}
}

function pwdStr(){
  const p=document.getElementById('pn').value;
  const box=document.getElementById('ps');
  if(!p){box.className='pw';return}
  let s=0;
  if(p.length>=8)s++;if(p.length>=12)s++;

  if(/\d/.test(p))s++;if(/[^a-zA-Z0-9]/.test(p))s++;
  if(s<=2){box.className='pw wk';box.innerHTML='⚠️ Weak password'}
  else if(s<=4){box.className='pw ok';box.innerHTML='👍 Medium password'}
  else{box.className='pw ok';box.innerHTML='💪 Strong password'}

function prevTF(){
  const no=(document.getElementById('tno')?.value||'').trim();
  const amt=parseFloat(document.getElementById('tam')?.value)||0;
  const box=document.getElementById('tfp');
  if(!box)return;
  const s=findA(parseInt(document.getElementById('ta')?.value));
  const all=findA_noAll(no);
  const d=all.length?(all.find(x=>s&&x.cur===s.cur)||all[0]):null;
  if(!d){box.textContent=no.length>=6?'❌ No account found with this number':'Recipient&#39;s NID Number ...';return}
  const o=findU_id(d.uid);
  const rn=o?{user:'Customer',agent:'Agent',admin:'Admin'}[o.role]:'';
  const rl=o?(o.role==='admin'?'Admin':o.role==='agent'?'Agent':'User'):'User';
  const mismatch=s&&s.cur!==d.cur;
  box.innerHTML='<div><b>Recipient:</b> '+esc(o?o.name:'—')+' <span class="rl r'+rl+'">'+rn+'</span></div><div><b>Account:</b> '+d.no+' ('+d.cur+')</div>'
    +((all.length>1&&!mismatch)?'<div style="color:var(--pl);margin-top:3px;">On this number: '+all.length+' account(s) (BDT+USD) — your '+d.cur+'  account selected</div>':'')
    +(mismatch?'<div style="color:var(--d);margin-top:3px;">⚠️ recipient has no '+s.cur+' No accounts</div>':'')
    +(amt>0?'<div style="margin-top:3px;"><b>Amount:</b> '+amt.toLocaleString()+' '+d.cur+'</div><div style="margin-top:3px;"><b>Fee:</b> '+cfg().feeTransfer+' BDT</div>':'');
}
function tfC(){
  try{
    const aid=parseInt(document.getElementById('ta').value);
    const no=document.getElementById('tno').value.trim();
    const amt=parseFloat(document.getElementById('tam').value);
    const code=document.getElementById('tt').value.trim();
    if(!(amt>0))throw new Error('Invalid amount');
    if(code.length!==6)throw new Error('6-digit TOTP');
    const s=findA(aid);
    if(!s||s.uid!==SS.id)throw new Error('No accounts');
    if(s.status!=='active')throw new Error('Your account is inactive');
    const d=findA_noC(no,s.cur);
    if(!d)throw new Error('Recipient account not found');
    if(d.id===s.id)throw new Error('Cannot transfer to your own account');
    if(d.status!=='active')throw new Error('Recipient account is inactive');
    if(s.cur!==d.cur)throw new Error('Recipient&#39;s '+s.cur+' account number required ('+d.cur+'  account found)');
    if(s.bal<amt)throw new Error('Insufficient balance');
    const me=findU_id(SS.id);
    if(!verifyTOTP(me.secret,code))throw new Error('Wrong TOTP');
    const FEE=Number(cfg().feeTransfer)||10;
    const bdt=DB.accs().find(x=>x.uid===SS.id&&x.cur==='BDT'&&x.status==='active');
    if(!bdt)throw new Error('Active BDT account required for the fee');
    if(bdt.id===s.id){if(s.bal<amt+FEE)throw new Error('balance low (amount + fee '+FEE+' BDT needed)')}
    else if(bdt.bal<FEE)throw new Error('Need in BDT account: '+FEE+' BDT needed');
    const nbs=(bdt.id===s.id)?s.bal-amt-FEE:s.bal-amt;
    const nbd=d.bal+amt;
    updAcc(s.id,{bal:nbs});
    if(bdt.id!==s.id)updAcc(bdt.id,{bal:bdt.bal-FEE});
    updAcc(d.id,{bal:nbd});
    addTx({aid:s.id,type:'transfer',amt:amt,cur:s.cur,bal_after:nbs,by:SS.id,dir:'out',note:'To: '+d.no+' • Fee '+FEE+' BDT'});
    addTx({aid:d.id,type:'transfer',amt:amt,cur:d.cur,bal_after:nbd,by:SS.id,dir:'in',note:'From: '+s.no});
    log(SS.id,'TRANSFER',{f:s.no,t:d.no,amt,cur:s.cur,fee:FEE});
    closeM();toast('✅ '+amt.toLocaleString()+' '+s.cur+' → '+esc(findU_id(d.uid)?.name||d.no)+' (fee '+FEE+' BDT)');render();
  }catch(e){toast(e.message,'e')}
}

  openM(`<div class="hn"></div><h2>💱 Buy / Sell Dollars</h2><p class="sb">Between your BDT and USD accounts — 10 BDT fee per transaction</p>
    <div class="fg"><label>From Account</label><select id="xa" onchange="prevX()">${opts}</select></div>
    <div class="fg"><label>To Account (You Receive)</label><select id="xt" onchange="prevX()">${opts}</select></div>
    <div class="aw"><span class="sy">৳</span><input type="number" id="xam" class="ai" min="1" step="0.01" placeholder="0.00" oninput="prevX()"></div>
    <div id="xp" style="background:rgba(212,175,55,.1);border-left:3px solid var(--g);padding:10px;border-radius:8px;margin-bottom:11px;font-size:12px;">Enter amount...</div>
    <div class="fg"><label>🔐 TOTP</label><input type="text" id="xtot" class="tin" maxlength="6" inputmode="numeric" placeholder="------"></div>
    <button class="btn bp" onclick="xC()">Confirm Exchange</button>`);
  if(MINE.length>1)document.getElementById('xt').value=MINE[1].id;
  prevX();
}
function prevX(){
  const a=findA(parseInt(document.getElementById('xa')?.value));
  const t=findA(parseInt(document.getElementById('xt')?.value));
  const amt=parseFloat(document.getElementById('xam')?.value)||0;
  const p=document.getElementById('xp');
  if(!p)return;
  if(!a||!t){p.textContent='Choose accounts...';return}
  if(a.id===t.id){p.textContent='Choose two different accounts';return}
  if(!(amt>0)){p.textContent='Enter amount...';return}
  try{
    const r=rate(a.cur,t.cur);
    const get=Number((amt*r).toFixed(2));
    p.innerHTML='<div style="display:flex;justify-content:space-between;"><span>Rate</span><b>1 '+a.cur+' = '+r.toFixed(4)+' '+t.cur+'</b></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:3px;"><span>You Receive</span><b style="color:#10b981;">'+get.toLocaleString()+' '+t.cur+'</b></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:3px;"><span>Fee</span><b style="color:var(--d);">10 BDT</b></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:3px;"><span>Action</span><b>'+(a.cur==='BDT'?'Buying USD 💵':'Selling USD 💵')+'</b></div>';
  }catch(e){p.textContent='Rate none'}
}
function xC(){
  try{
    const aid=parseInt(document.getElementById('xa').value);
    const tid=parseInt(document.getElementById('xt').value);
    const amt=parseFloat(document.getElementById('xam').value);
    const code=document.getElementById('xtot').value.trim();
    if(!(amt>0))throw new Error('Invalid amount');
    if(code.length!==6)throw new Error('6-digit TOTP');
    const s=findA(aid),t=findA(tid);
    if(!s||!t||s.uid!==SS.id||t.uid!==SS.id)throw new Error('No accounts');
    if(s.id===t.id)throw new Error('Same account selected');
    if(s.status!=='active'||t.status!=='active')throw new Error('Account Inactive');
    const me=findU_id(SS.id);
    if(!verifyTOTP(me.secret,code))throw new Error('Wrong TOTP');
    const r=rate(s.cur,t.cur);
    const get=Number((amt*r).toFixed(2));
    if(!(get>0))throw new Error('Rate error');
    if(s.cur==='BDT'&&get<1)throw new Error('Too small to buy USD (minimum 110 BDT)');
    const FEE=10;
    const bdt=DB.accs().find(x=>x.uid===SS.id&&x.cur==='BDT'&&x.status==='active');
    if(!bdt)throw new Error('Active BDT account required for the fee');
    if(s.bal<amt)throw new Error(s.cur+' account: insufficient balance');
    if(bdt.id===s.id&&s.bal<amt+FEE)throw new Error('Insufficient balance (amount + 10 BDT fee = '+(amt+FEE).toFixed(2)+' required)');
    if(bdt.id!==s.id&&bdt.id!==t.id&&bdt.bal<FEE)throw new Error('Need in BDT account: '+FEE+' BDT needed');
    if(bdt.id===t.id&&(t.bal+get)<FEE)throw new Error('Received BDT not enough for fee');
    const dlt={};dlt[s.id]=(dlt[s.id]||0)-amt;dlt[t.id]=(dlt[t.id]||0)+get;dlt[bdt.id]=(dlt[bdt.id]||0)-FEE;
    for(const k in dlt){
      const acc=findA(Number(k));
      const nb=acc.bal+dlt[k];
      if(nb<-0.001)throw new Error(acc.cur+' account: insufficient balance');
      updAcc(acc.id,{bal:nb});
    }
    const sb2=findA(s.id).bal,tb2=findA(t.id).bal;
    addTx({aid:s.id,type:'exchange',amt:amt,cur:s.cur,rate:r,tcur:t.cur,tamt:get,bal_after:sb2,by:SS.id,dir:'out',note:(s.cur==='BDT'?'Buying USD 💵':'Selling USD 💵')+' → '+get+' '+t.cur+' • Fee 10 BDT'});
    addTx({aid:t.id,type:'exchange',amt:get,cur:t.cur,rate:r,tcur:s.cur,tamt:amt,bal_after:tb2,by:SS.id,dir:'in',note:'Currency exchange ← '+amt+' '+s.cur});
    log(SS.id,'EXCHANGE',{f:s.no,t:t.no,amt,cur:s.cur,got:get,fee:FEE});
    closeM();toast('✅ '+(s.cur==='BDT'?'Bought':'Sold')+' '+get+' '+t.cur+' (fee '+FEE+' BDT)');render();
  }catch(e){toast(e.message,'e')}
}
function accDet(id){
  const a=findA(id);
  if(!a)return toast('none','e');
  const txs=DB.txs().filter(t=>t.aid===a.id);
  openM(`<div class="hn"></div><h2>${accL(a.type)}</h2><p class="sb">${a.no}</p>
    <div class="bc" style="background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;margin-bottom:12px;"><div class="l" style="color:var(--g);">Balance</div><div class="a">${a.bal.toLocaleString()} <span style="font-size:12px;opacity:.8;">${a.cur}</span></div></div>
    <div class="st">📜 Transactions (${txs.length})</div>
    ${txList(txs)}
    <button class="btn bo" style="margin-top:10px;" onclick="closeM()">Disabled</button>`);
}
function txList(txs){
  if(!txs||!txs.length)return '<div class="emp" style="padding:20px;"><p style="font-size:12px;">No transactions yet</p></div>';
  const ic={deposit:'💰',withdraw:'💸',cash_in:'📥',cash_out:'📤',exchange:'💱',transfer:'🔁',commission:'💼',feeIncome:'🏦'};
  const bg={deposit:'#d1fae5',withdraw:'#fee2e2',cash_in:'#d1fae5',cash_out:'#fee2e2',exchange:'#fef3c7',transfer:'#e0e7ff',commission:'#fce7f3',feeIncome:'#ecfccb'};
  const inc=['deposit','cash_in'];
  return txs.slice(0,30).map(t=>{
    const isIn=inc.includes(t.type)||t.dir==='in';
    const sign=isIn?'+ ':'- ';
    return `<div class="tx"><div class="ti" style="background:${bg[t.type]||'#f1f5f9'};">${ic[t.type]||'💳'}</div><div class="in"><h4>${txL(t.type)} ${t.status==='reversed'?'<span class="bd2 bR">Reversed</span>':''}</h4><p>${fT(t.created)} • ${(t.ref||'').slice(0,12)}</p>${t.tcur?'<p style="color:var(--gd);">→ '+t.tamt+' '+t.tcur+'</p>':''}${t.note?'<p style="color:var(--gd);">'+esc(t.note)+'</p>':''}</div><div class="tam ${isIn?'plus':'minus'}">${sign}${t.amt.toLocaleString()}<br><span style="font-size:9px;opacity:.6;">${t.cur}</span></div></div>`;
  }).join('');
}

/* ============ 25. INIT ============ */
(function init(){
  fbInit();
  (async function boot(){
    await fbPull();
    initAdmin();
    DB.users().forEach(u=>ensureTwinAcc(u.id));
    DB.accs().forEach(a=>{const u=findU_id(a.uid);if(u&&(u.doc||'nid')==='nid'&&u.nid&&a.no!==String(u.nid))updAcc(a.id,{no:String(u.nid)})});
    applyCfg();
    const s=getSS();
    if(s){
      const u=findU_id(s.id);
      if(u&&u.status==='active')setTimeout(()=>showApp(),80);
      else clrSS();
    }
    fbPush();
  })();
})();
</script>
